<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>News quiz · Daily ESL News · MRJ English</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/app.css"/>
</head>
<body class="quiz-page">
  <div class="glow" aria-hidden="true"></div>
  <header class="qhead">
    <a class="back" href="index.html" data-i18n="all_quizzes">← All quizzes</a>
    <label class="lang-wrap">
      <span class="sr" data-i18n="language">Language</span>
      <select id="lang-select" aria-label="Language"></select>
    </label>
    <span class="host-pill" data-i18n="quiz_host" title="Q2 Lively Game Show Host">🎙️ Quiz host</span>
  </header>
  <p class="kicker" id="date-line" data-i18n="kicker">Daily ESL News</p>
  <h1 id="title">Loading…</h1>
  <p class="sub" id="sub" data-i18n="sub">Tap the question or A · B · C · D to hear the host. Then submit for your score.</p>
  <div class="progress" id="progress"></div>
  <form id="quiz"></form>
  <div class="bar sticky">
    <button type="button" class="chunk" id="submit" data-i18n="lock_in">Lock in answers ★</button>
    <button type="button" class="ghost" id="reset" data-i18n="try_again">Try again</button>
  </div>
  <section id="results" class="hidden"></section>
  <p class="hint-foot" data-i18n="hint_foot">Tap any sentence to hear it. Same quiz-show host every day.</p>
  <script src="js/i18n.js"></script>
  <script src="js/quiz.js"></script>
</body>
</html>
